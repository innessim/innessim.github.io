# Add one new entry per publication, in any order — the include automatically
# groups and sorts by year, newest year first, so you never need to manually
# position a new entry in this file.
#
#
# Fields:
#   authors   - author list, plain string (wrap your name in __ __ to bold it)
#   title     - paper title
#   journal   - journal name
#   year      - publication year (used for grouping/sorting)
#   volume    - volume/issue, e.g. "42" or "12(3)" (optional)
#   pages     - page range, e.g. "100-110" (optional)
#   pdf-url   - link to a PDF (optional, shows a PDF icon)
#   data-url  - link to a data repository, e.g. Zenodo/Dryad (optional, shows a database icon)
#   github    - link to code repository (optional, shows a GitHub icon)
#   openaccess - true/false (optional, reserved for a future open-access icon)
 
