# Add one new entry per publication. Newest first isn't required — the
# include automatically groups and sorts by year, newest year on top.
#
# Fields:
#   year     - publication year (used for grouping/sorting)
#   authors  - full author list as a plain string, formatted however you like
#   title    - paper title
#   journal  - journal name
#   volume   - volume/issue, e.g. "42(3)"
#   pages    - page range, e.g. "100-110"
#   url      - link to the paper (DOI, journal page, PDF, etc.)

- year: 2026
  authors: "Lucas J. Albano, Cristina C. Bastias, Aurélien Estarague, Brandon T. Hendrickson, Simon G. Innes, Nevada King, Courtney M. Patterson, Amelia Tudoran, François Vasseur, Adriana Puentes, Cyrille Violle, Nicholas J. Kooyers, Marc T. J. Johnson"
  title: "A transcontinental experiment elucidates (mal)adaptation of a cosmopolitan plant to climate in space and time"
  journal: "Ecological monographs"
  volume: "96(1)"
  pages: "e70043"
  url: "https://doi.org/example"

- year: 2025
  authors: "Innes, S., Author, A., & Author, B."
  title: "Title of another paper goes here"
  journal: "Journal Name"
  volume: "8(1)"
  pages: "45-60"
  url: "https://doi.org/example2"
