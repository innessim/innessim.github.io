{% assign courses_sorted = site.data.courses | sort: "year" | reverse %}

<ul>
  {% for course in courses_sorted %}
    <li>
      <strong>{{ course.terms }}</strong><br>
      <strong>{{ course.role }}</strong>, <em>{{ course.title }}</em> ({{ course.code }})<br>
      {{ course.institution }}
    </li>
  {% endfor %}
</ul>
